<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Transaction - FinWise</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="form-container">

        <h2>Add Transaction</h2>

        <form method="POST">

            <label>Transaction Type</label>

            <select name="type" required>

                <option value="">
                    Select Type
                </option>

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expense
                </option>

            </select>

            <input
                type="number"
                name="amount"
                placeholder="Amount"
                step="0.01"
                required
            >

            <input
                type="text"
                name="category"
                placeholder="Category (Food, Travel, Salary...)"
                required
            >

            <input
                type="text"
                name="description"
                placeholder="Description (Optional)"
            >

            <input
                type="date"
                name="date"
                required
            >

            <button type="submit">
                ADD TRANSACTION
            </button>

        </form>

        <p>
            <a href="{{ url_for('dashboard') }}">
                Back to Dashboard
            </a>
        </p>

    </div>

</body>

</html>
